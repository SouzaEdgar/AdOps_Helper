<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <script>
        window.addEventListener("message", (event) => {
            const tag = event.data;

            if (tag) {
                document.open();
                document.write(tag);
                document.close();
            } else {
                document.body.innerHTML = "Nenhuma tag recebida.";
            }
        });
    </script>
</body>
</html>
